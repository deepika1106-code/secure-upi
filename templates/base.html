<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure UPI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4"><div class="container">
  <span class="navbar-brand">🛡️ Secure UPI Fraud Detection</span>
  {% if session.uid %}<div class="text-white">
    <a class="text-white me-3" href="/">Check Transaction</a>
    {% if session.role=='admin' %}<a class="text-white me-3" href="/dashboard">Dashboard</a>{% endif %}
    {{ session.name }} ({{ session.role }}) <a class="text-white ms-3" href="/logout">Logout</a></div>{% endif %}
</div></nav>
<div class="container">
{% with m = get_flashed_messages() %}{% for x in m %}<div class="alert alert-danger">{{ x }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}</div></body></html>
