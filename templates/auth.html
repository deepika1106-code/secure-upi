{% extends "base.html" %}{% block body %}
<div class="card mx-auto" style="max-width:380px"><div class="card-body">
<h4>{{ mode }}</h4>
<form method="post">
  <input class="form-control mb-2" name="username" placeholder="Username" required>
  <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
  <button class="btn btn-primary w-100">{{ mode }}</button>
</form>
<div class="mt-3 small">{% if mode=='Login' %}New? <a href="/register">Register</a>{% else %}Have an account? <a href="/login">Login</a>{% endif %}</div>
</div></div>{% endblock %}
